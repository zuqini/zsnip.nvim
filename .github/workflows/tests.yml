name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Each version reports on its own: a failure on one must not cancel the
      # others and hide whether they would have passed. The 0.13.0 floor has
      # not released, so nightly runs alone until stable can rejoin.
      fail-fast: false
      matrix:
        neovim-version: ['nightly']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install --tree .luarocks busted 2.3.0

      - name: Run tests
        run: nvim --version && nvim -u NONE -l tests/busted.lua
